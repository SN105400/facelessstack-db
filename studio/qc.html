<!doctype html>
<html>
<head><meta charset="utf-8"><title>Video QC</title>
<style>html,body{margin:0;background:#000;height:100%}video{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head>
<body>
<video id="v" muted playsinline preload="auto"></video>
<script>
  const v = document.getElementById('v');
  v.src = new URLSearchParams(location.search).get('src');
  window.vmeta = () => ({ duration: v.duration, w: v.videoWidth, h: v.videoHeight,
                          readyState: v.readyState, ended: v.ended,
                          error: v.error ? v.error.message : null });
  window.seekTo = (t) => new Promise(res => {
    const done = () => setTimeout(res, 120);
    v.addEventListener('seeked', done, { once: true });
    v.currentTime = t;
    setTimeout(res, 1500);
  });
</script>
</body>
</html>
