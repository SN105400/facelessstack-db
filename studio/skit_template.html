<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skit template — JSON-driven, self-encoding</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0d18; overflow: hidden; height: 100%; }
  canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; }
  #status { position: fixed; top: 4px; left: 8px; color: #8fa0c9; font: 12px monospace; z-index: 9; }
</style>
</head>
<body>
<canvas id="c" width="540" height="960"></canvas>
<div id="status">loading…</div>
<script>
// SKIT TEMPLATE — one template renders ANY skit from a declarative JSON script.
//   studio/scripts/<name>.json = { title, duration, fps, lines[], captions[], beats[], sfx[] }
// Modes: (default) live preview · ?static=1 stills for QC · ?encode=1 self-encode → ready-to-post
// The encode loop is fully synchronous (no rAF/timers) so it runs unthrottled in background tabs.
const qs = new URLSearchParams(location.search);
const NAME = qs.get('name');
const ENCODE = qs.has('encode');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const statusEl = document.getElementById('status');
const setStatus = s => { statusEl.textContent = s; };

const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
{ const vx = vig.getContext('2d');
  const v = vx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
  vx.fillStyle = v; vx.fillRect(0, 0, W, H); }
const grain = [];
for (let g = 0; g < 2; g++) {
  const gc = document.createElement('canvas'); gc.width = 128; gc.height = 128;
  const gx = gc.getContext('2d'), img = gx.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 10;
  }
  gx.putImageData(img, 0, 0); grain.push(gc);
}

// ---------- pose library ----------
// Base params every pose may set; walk adds sinusoids on top.
const POSES = {
  idle:       { lean: 0.04, armF: 0.12, armB: -0.12, eF: 0.45, eB: 0.45, flatEye: false },
  'talk-phone': { lean: 0.06, armF: 1.9, eF: 0.25, armB: -0.1, eB: 0.4, phone: true },
  shock:      { lean: -0.10, armF: -2.2, armB: 2.0, eF: 0.3, eB: 0.3, hop: true },
  facepalm:   { lean: 0.02, armF: -2.4, eF: 1.9, armB: 0.15, eB: 0.35, hipY: -3 },
  'walk-away':{ walk: true, lean: 0.10, scroll: true },
  think:      { lean: -0.03, armF: 0.5, eF: 1.6, armB: -0.3, eB: 0.5, hipY: -2 },
  wave:       { lean: 0.02, armF: -1.5, eF: 0.25, armB: -0.1, eB: 0.4, waveArm: true },
};

function poseAt(script, t) {
  const beats = script.beats;
  let beat = beats[beats.length - 1];
  for (const b of beats) if (t >= b.from && t < (b.to ?? script.duration)) { beat = b; break; }
  const pose = { ...POSES[beat.pose ?? 'idle'] };
  // blend from the previous beat over the first 0.35s (smooth transitions)
  const idx = beats.indexOf(beat);
  const t0 = beat.from ?? 0;
  if (idx > 0) {
    const prev = POSES[beats[idx - 1].pose ?? 'idle'];
    const k = Math.min(1, (t - t0) / 0.35), e = k * k * (3 - 2 * k);
    for (const key of ['lean', 'armF', 'armB', 'eF', 'eB', 'hipY']) {
      const a = prev[key] ?? 0, b = pose[key] ?? 0;
      if (a !== undefined || b !== undefined) pose[key] = (a ?? 0) + ((b ?? 0) - (a ?? 0)) * e;
    }
    pose.walk = pose.walk || (prev.walk && e < 0.5);
  }
  if (pose.hop) pose.hop = Math.sin(Math.min(1, (t - t0) / 0.5) * Math.PI) * 10;
  return pose;
}

function drawStickman(t, pose, script, rms) {
  const GY = H * 0.70, CX = W * 0.46;
  let hipY = GY - 58 + (pose.hipY ?? 0), lean = pose.lean ?? 0;
  let thighF = 0.08, thighB = -0.08, kneeF = 0.10, kneeB = 0.10;
  let armF = pose.armF ?? 0.12, armB = pose.armB ?? -0.12, eF = pose.eF ?? 0.45, eB = pose.eB ?? 0.45;
  let scrollOff = 0;
  if (pose.walk) {
    const wf = t * 2.2 * Math.PI * 2, s = 0.55 * Math.sin(wf);
    thighF = s; thighB = -s;
    kneeF = Math.max(0.12, 0.5 * Math.sin(wf + 0.9)); kneeB = Math.max(0.12, 0.5 * Math.sin(wf + 0.9 + Math.PI));
    if ((pose.armF ?? 0) === 0) { armF = -0.7 * Math.sin(wf) + 0.1; armB = 0.7 * Math.sin(wf) - 0.1; }
    hipY += -3 * Math.abs(Math.sin(wf));
    scrollOff = (t * 150) % 46;
  }
  if (pose.waveArm) armF = (pose.armF ?? -1.5) + 0.25 * Math.sin(t * Math.PI * 6);
  const hop = pose.hop ? pose.hop : 0;
  const hipX = CX, lx = Math.sin(lean), ly = Math.cos(lean);
  const neckX = hipX + lx * 34, neckY = hipY - ly * 34 + hop;
  const headX = neckX + lx * 14, headY = neckY - 15;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#e8ecff'; ctx.fillStyle = '#e8ecff';
  const seg = (x1,y1,x2,y2,w) => { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  function leg(th, kn) { const kx = hipX + Math.sin(th)*26, ky = hipY + Math.cos(th)*26;
    const fx = kx + Math.sin(th-kn)*30, fy = ky + Math.cos(th-kn)*30;
    seg(hipX, hipY, kx, ky, 5); seg(kx, ky, fx, fy, 4); }
  function arm(a, e) { const ex = neckX + Math.sin(a)*22, ey = neckY + Math.cos(a)*22;
    const hx = ex + Math.sin(a+e)*20, hy = ey + Math.cos(a+e)*20;
    seg(neckX, neckY, ex, ey, 4); seg(ex, ey, hx, hy, 3.5); }
  leg(thighB, kneeB);
  seg(hipX, hipY, neckX, neckY, 5);
  arm(armB, eB);
  leg(thighF, kneeF);
  arm(armF, eF);
  ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(headX, headY, 11, 0, Math.PI*2); ctx.stroke();
  const mouthOpen = rms * 6 * (pose.phone ? 0 : 1);
  if (mouthOpen > 0.08) {
    ctx.beginPath(); ctx.ellipse(headX + 6, headY + 4.5, 2.4, 1 + 3 * Math.min(1, mouthOpen), 0, 0, Math.PI*2); ctx.fill();
  } else if (script.deadpan && t >= (script.deadpan.from ?? 1e9)) {
    ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(headX + 1, headY - 3); ctx.lineTo(headX + 7, headY - 2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(headX + 4, headY - 2, 1.8, 0, Math.PI*2); ctx.fill();
  }
  if (pose.phone) { ctx.fillStyle = '#4a5a94'; ctx.fillRect(neckX + 26, neckY + 2, 12, 20); }
  return scrollOff;
}

function drawAt(tSec, script, rms) {
  const t = Math.min(tSec, script.duration);
  ctx.fillStyle = '#0a0d18'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1226'); g.addColorStop(1, '#04060d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const scrollOff = drawStickman(t, poseAt(script, t), script, rms);
  ctx.strokeStyle = '#3a4468'; ctx.lineWidth = 3;
  const GY = H * 0.70;
  ctx.beginPath(); ctx.moveTo(0, GY + 1); ctx.lineTo(W, GY + 1); ctx.stroke();
  if (scrollOff) {
    ctx.lineWidth = 2; ctx.strokeStyle = '#26304f';
    for (let x = -scrollOff; x < W; x += 46) { ctx.beginPath(); ctx.moveTo(x, GY + 4); ctx.lineTo(x - 9, GY + 14); ctx.stroke(); }
  }
  const cap = (script.captions || []).find(c => t >= c.from && t <= c.to);
  if (cap) {
    ctx.font = 'bold 27px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.78)';
    ctx.strokeText(cap.text, W/2, H * 0.88); ctx.fillStyle = '#ffffff';
    ctx.fillText(cap.text, W/2, H * 0.88);
  }
  const flash = (script.sfx || []).find(s => s.text && t >= s.t && t <= s.t + 0.8);
  if (flash) {
    ctx.font = 'bold 34px system-ui, sans-serif'; ctx.fillStyle = '#ffd76e';
    ctx.fillText(flash.text, W/2, H * 0.2);
  }
  ctx.drawImage(vig, 0, 0);
}
window.drawAt = drawAt;
window.__renderReady = true;

// ---------- self-encode ----------
(async () => {
  if (!ENCODE || !NAME) { setStatus('preview mode'); requestAnimationFrame(function loop(now) { requestAnimationFrame(loop); drawAt(now / 1000, window.__script || { duration: 9, beats: [], captions: [] }, 0); }); return; }
  try {
    setStatus('loading script…');
    const script = await (await fetch(`/studio/scripts/${NAME}.json`)).json();
    window.__script = script;
    const mod = await import('https://cdn.jsdelivr.net/npm/webm-muxer@5/+esm');
    const muxer = new mod.Muxer({ target: new mod.ArrayBufferTarget(),
      video: { codec: 'V_VP9', width: W, height: H, frameRate: script.fps ?? 24 },
      audio: { codec: 'A_OPUS', numberOfChannels: 1, sampleRate: 48000 } });
    const venc = new VideoEncoder({ output: (ch, m) => muxer.addVideoChunk(ch, m), error: e => setStatus('verr: ' + e.message) });
    venc.configure({ codec: 'vp09.00.10.08', width: W, height: H, bitrate: 4000000, framerate: script.fps ?? 24 });
    const aenc = new AudioEncoder({ output: (ch, m) => muxer.addAudioChunk(ch, m), error: e => setStatus('aerr: ' + e.message) });
    aenc.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 1, bitrate: 96000 });
    const buf = await (await fetch(`/studio/${NAME}-mix.wav`)).arrayBuffer();
    const audio = await new AudioContext({ sampleRate: 48000 }).decodeAudioData(buf);
    const CH = audio.getChannelData(0), SR = 48000, FPS = script.fps ?? 24;
    const rmsAt = t => { const s0 = Math.max(0, Math.floor(t*SR)-1024), s1 = Math.min(CH.length, Math.floor(t*SR));
      let sum = 0, n = 0; for (let i = s0; i < s1; i += 8) { sum += CH[i]*CH[i]; n++; } return n ? Math.sqrt(sum/n) : 0; };
    const totalFrames = Math.round(script.duration * FPS);
    for (let i = 0; i < totalFrames; i++) {
      const t = i / FPS;
      drawAt(t, script, Math.min(1, rmsAt(t) * 6));
      const vf = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      venc.encode(vf, { keyFrame: i % 48 === 0 });
      vf.close();
      if (i % 24 === 0) setStatus(`encode ${i}/${totalFrames}`);
    }
    setStatus('flushing…');
    await venc.flush();
    const CHUNK = 4800;
    for (let off = 0; off < CH.length; off += CHUNK) {
      const n = Math.min(CHUNK, CH.length - off);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n,
        numberOfChannels: 1, timestamp: Math.round(off / SR * 1e6), data: CH.subarray(off, off + n) });
      aenc.encode(ad);
    }
    await aenc.flush();
    muxer.finalize();
    setStatus('uploading…');
    const buffer = muxer.target.buffer;
    const d = new Date(), ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const res = await fetch(`/upload?name=studio/ready-to-post/${ds}-${NAME}.webm`, { method: 'POST', body: new Blob([buffer], { type: 'video/webm' }) });
    const saved = await res.text();
    setStatus('DONE: ' + saved);
    window.__done = { ok: true, saved, bytes: buffer.byteLength, frames: totalFrames };
  } catch (e) {
    setStatus('ERROR: ' + e.message);
    window.__done = { ok: false, error: e.message };
  }
})();
</script>
</body>
</html>
