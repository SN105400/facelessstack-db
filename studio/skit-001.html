<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skit 001 — They cloned his voice (8.2s)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0d18; overflow: hidden; height: 100%; }
  canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; }
</style>
</head>
<body>
<canvas id="c" width="540" height="960"></canvas>
<script>
// SKIT 001 — "They cloned his voice in 3 seconds" (everyday comedy + safety PSA)
// Beats (audio-driven): ring 0-0.7 | mom 0.75-2.2 | clone 2.3-4.15 | shock 4.3-5.9 | mom punch 6.35-7.4 | end 7.5-8.2
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, T = 8.2, FPS = 24;
const GY = H * 0.70, CX = W * 0.46;

const CAPS = [
  { from: 0.75, to: 2.20, text: 'Mom: Sweetie? You never call me!' },
  { from: 2.30, to: 4.15, text: '"Mom, it\'s really me! Bail money!"' },
  { from: 4.30, to: 5.90, text: 'Wait. That\'s MY voice?!' },
  { from: 6.35, to: 7.40, text: 'Mom: Nice try, scammer.' },
  { from: 7.45, to: 8.20, text: '3 seconds of audio is all they need.' },
];

const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
{ const vx = vig.getContext('2d');
  const v = vx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
  vx.fillStyle = v; vx.fillRect(0, 0, W, H); }

function drawAt(tSec, mouthOpen) {
  const tt = Math.min(((tSec / T) % 1 + 1) % 1 * T, T);
  ctx.fillStyle = '#0a0d18'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1226'); g.addColorStop(1, '#04060d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // room: floor + phone on nightstand (right side)
  ctx.strokeStyle = '#3a4468'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, GY + 1); ctx.lineTo(W, GY + 1); ctx.stroke();
  ctx.fillStyle = '#1a2242'; ctx.strokeStyle = '#4a5a94'; ctx.lineWidth = 2;
  ctx.fillRect(W * 0.72, GY - 26, 74, 26); ctx.strokeRect(W * 0.72, GY - 26, 74, 26);
  ctx.fillStyle = '#0f1630'; ctx.fillRect(W * 0.72 + 28, GY - 46, 16, 20);
  ctx.strokeStyle = '#5a6a95'; ctx.strokeRect(W * 0.72 + 28, GY - 46, 16, 20);

  // stickman state machine
  let hipY = GY - 58, lean = 0.06, thighF = 0.08, thighB = -0.08,
      kneeF = 0.10, kneeB = 0.10, armF = 0.10, armB = -0.10, eF = 0.4, eB = 0.4,
      hop = 0, walk = false;
  if (tt < 0.75) { walk = true; }                                  // walks to the phone
  else if (tt < 2.20) { armF = 1.9; eF = 0.25; }                   // phone to ear (mom speaking)
  else if (tt < 4.15) {                                            // clone speaks — suspicion grows
    const k = Math.min(1, (tt - 2.3) / 1.6);
    armF = 1.9; eF = 0.25; lean = 0.06 - 0.18 * k;                 // leans back
    hipY -= 2 * k;
  } else if (tt < 5.90) {                                          // shock: hop back, arms up
    const k = Math.min(1, (tt - 4.3) / 0.5);
    hop = 10 * Math.sin(Math.min(1, k) * Math.PI);
    hipY -= 6 * Math.min(1, k);
    armF = -2.2; armB = 2.0; eF = 0.3; eB = 0.3; lean = -0.10;
  } else {                                                          // facepalm
    const k = Math.min(1, (tt - 6.3) / 0.6);
    armF = -2.4 * k + 0.1 * (1 - k); eF = 1.9 * k;
    armB = 0.15; eB = 0.35; hipY -= 3 * k;
  }
  if (walk) { const wf = tt * 2.2 * Math.PI * 2;
    const s = 0.55 * Math.sin(wf); thighF = s; thighB = -s;
    kneeF = Math.max(0.12, 0.5 * Math.sin(wf + 0.9)); kneeB = Math.max(0.12, 0.5 * Math.sin(wf + 0.9 + Math.PI));
    armF = -0.7 * Math.sin(wf) + 0.1; armB = 0.7 * Math.sin(wf) - 0.1;
    hipY += -3 * Math.abs(Math.sin(wf)); }
  hipY -= hop;

  const hipX = CX, lx = Math.sin(lean), ly = Math.cos(lean);
  const neckX = hipX + lx * 34, neckY = hipY - ly * 34;
  const headX = neckX + lx * 14, headY = neckY - 15;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#e8ecff'; ctx.fillStyle = '#e8ecff';
  const seg = (x1,y1,x2,y2,w) => { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  function leg(th, kn) { const kx = hipX + Math.sin(th)*26, ky = hipY + Math.cos(th)*26;
    const fx = kx + Math.sin(th-kn)*30, fy = ky + Math.cos(th-kn)*30;
    seg(hipX, hipY, kx, ky, 5); seg(kx, ky, fx, fy, 4); }
  function arm(a, e) { const ex = neckX + Math.sin(a)*22, ey = neckY + Math.cos(a)*22;
    const hx = ex + Math.sin(a+e)*20, hy = ey + Math.cos(a+e)*20;
    seg(neckX, neckY, ex, ey, 4); seg(ex, ey, hx, hy, 3.5); }
  leg(thighB, kneeB);
  seg(hipX, hipY, neckX, neckY, 5);
  arm(armB, eB);
  leg(thighF, kneeF);
  arm(armF, eF);
  ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(headX, headY, 11, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(headX + 4, headY - 2, 1.8, 0, Math.PI*2); ctx.fill();
  if (mouthOpen > 0.08 && (tt >= 2.2 && tt < 4.15 || tt >= 4.3 && tt < 5.9)) {
    ctx.beginPath(); ctx.ellipse(headX + 6, headY + 4.5, 2.4, 1 + 3 * mouthOpen, 0, 0, Math.PI*2); ctx.fill();
  }
  // phone held to ear
  if (tt >= 0.75 && tt < 6.2) {
    const phx = neckX + Math.sin(armF + eF + 0.15) * 40, phy = neckY + Math.cos(armF + eF + 0.15) * 40 - 4;
    ctx.fillStyle = '#4a5a94'; ctx.fillRect(phx - 3, phy - 6, 6, 12);
  }

  const cap = CAPS.find(c => tt >= c.from && tt <= c.to);
  if (cap) {
    ctx.font = 'bold 27px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.78)';
    ctx.strokeText(cap.text, W/2, H * 0.88); ctx.fillStyle = '#ffffff';
    ctx.fillText(cap.text, W/2, H * 0.88);
  }
  ctx.drawImage(vig, 0, 0);
}
window.drawAt = drawAt;
let last = 0;
function frame(now) { requestAnimationFrame(frame); drawAt((now / 1000) % T, 0); }
if (!location.search.includes('static')) requestAnimationFrame(frame);
</script>
</body>
</html>
